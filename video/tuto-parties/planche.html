<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tuto 4 — les écrans</title>
<style>
  body { margin: 0; padding: 32px; background: #f2ede3; font: 15px/1.4 "Atkinson Hyperlegible", system-ui, sans-serif; color: #2b2620; }
  h1 { font: 600 26px/1.2 Vollkorn, Georgia, serif; margin: 0 0 4px; }
  p.chapeau { margin: 0 0 24px; color: #6b6156; }
  .passage { margin: 0 0 28px; }
  .passage h2 { font: 600 18px/1.2 Vollkorn, Georgia, serif; margin: 0 0 10px; }
  .grille { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  figure { margin: 0; background: #fff; border-radius: 8px; padding: 6px; box-shadow: 0 1px 3px #0002; }
  figure img { width: 100%; display: block; border-radius: 4px; }
  figcaption { font-size: 13px; color: #6b6156; padding: 4px 2px 0; }
</style>
</head>
<body>
<h1>Tuto 4 — Parties et chapitres</h1>
<p class="chapeau">Les vrais écrans, joués sur la base locale, rangés par passage du script.</p>
<div id="planche"></div>
<script>
  const passages = [
    ["2 — « Parties et chapitres » : l'écran d'aide, puis les trois parties", ["preparation", "aide", "plan"]],
    ["3 — « Ajouter un chapitre » : titre, résumé, image", ["reglages", "titre-frappe", "resume-focus", "resume-1", "resume-2", "images", "images-riviere", "image-choisie", "chapitre-ajoute", "plan-rempli"]],
    ["4 — Glisser les cartes, et d'une partie à une autre", ["avant-fete", "tire-fete", "pose-fete", "avant-gardien", "tire-gardien", "pose-gardien"]],
    ["5 — « Attribuer des élèves »", ["avant-menu", "menu", "attribuer", "coche-1", "coche-2", "coche-3", "coche-4", "attribue"]],
    ["6 — Les chapitres prêts", ["tous-attribues"]],
  ];

  fetch("captures/boites.json").then((r) => r.json()).then(({ ecrans }) => {
    const cles = Object.keys(ecrans);
    const racine = document.getElementById("planche");
    for (const [titre, noms] of passages) {
      const s = document.createElement("section");
      s.className = "passage";
      s.innerHTML = `<h2>${titre}</h2><div class="grille"></div>`;
      for (const nom of noms) {
        const cle = cles.find((c) => c.slice(3) === nom);
        if (!cle) continue;
        s.querySelector(".grille").insertAdjacentHTML("beforeend", `<figure><img src="captures/${cle}.png" alt=""><figcaption>${cle}</figcaption></figure>`);
      }
      racine.append(s);
    }
  });
</script>
</body>
</html>
