<!doctype html>
<meta charset="utf-8">
<title>Cadre pour captures</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}iframe{border:0;display:block}</style>
<!-- Affiche une vue de la maquette dans un cadre de 390 px de large : cadre-mobile.html?src=recit.html%23/plan&h=2400
     Autre largeur : &w=1366. Sans la barre de présentation, comme sur les captures du côté élève : &nu=1 -->
<script>
const p = new URLSearchParams(location.search);
document.write(`<iframe src="../${p.get('src')}" width="${p.get('w') || 390}" height="${p.get('h') || 844}"></iframe>`);
if (p.get('nu')) document.querySelector('iframe').addEventListener('load', ev => { const b = ev.target.contentDocument.querySelector('.maquette'); if (b) b.style.display = 'none'; });
</script>
