# Étape 9, lot 8 : la sauvegarde de la nuit (F14, « Sauvegarde automatique », F14-AC30).
#
# Chaque nuit vers 3 h, heure de Paris (pendant la fermeture nocturne des classes), la base et les
# images partent dans le seau S3 du porteur, à Paris. Les PDF ne sont pas copiés : ils se
# refont depuis le livre. Le seau efface lui-même ce qui a plus de quatre-vingt-dix jours (règle
# de durée réglée chez AWS) ; l'accès qui dépose ici ne peut ni lire ni effacer. Une nuit qui
# échoue envoie le courriel d'échec de GitHub au porteur.
#
# Un déclenchement à 1 h 17 en temps universel (3 h 17 à Paris l'été, 2 h 17 l'hiver ; les heures
# rondes sont les plus encombrées). GitHub lance une tâche programmée « au mieux », parfois avec
# des heures de retard : la sauvegarde se fait alors à son arrivée, jamais sautée (F14-AC30).

name: Sauvegarde de la nuit

on:
  schedule:
    - cron: "17 1 * * *"
  # À la main, depuis l'onglet « Actions » : pour l'essayer, ou rattraper une nuit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sauvegarde-nocturne
  cancel-in-progress: false

jobs:
  sauvegarder:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Les clés de la vraie base, le temps de la sauvegarde
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_CLE_SECRETE: ${{ secrets.SUPABASE_CLE_SECRETE }}
          SUPABASE_ADRESSE_BASE: ${{ secrets.SUPABASE_ADRESSE_BASE }}
          SUPABASE_MOT_DE_PASSE_BASE: ${{ secrets.SUPABASE_MOT_DE_PASSE_BASE }}
        run: |
          umask 077
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_CLE_SECRETE=$SUPABASE_CLE_SECRETE"
            echo "SUPABASE_ADRESSE_BASE=$SUPABASE_ADRESSE_BASE"
            echo "SUPABASE_MOT_DE_PASSE_BASE=$SUPABASE_MOT_DE_PASSE_BASE"
          } > production.env
          # L'outil de Supabase lit config.toml, qui demande la clé de signature de la base locale :
          # hors de Git, elle n'existe pas ici. Une clé jetable suffit, la sauvegarde ne s'en sert pas.
          node -e 'const c=require("crypto");const j=c.generateKeyPairSync("ec",{namedCurve:"P-256"}).privateKey.export({format:"jwk"});require("fs").writeFileSync("supabase/signing_keys.json",JSON.stringify([{kty:j.kty,kid:c.randomUUID(),use:"sig",key_ops:["sign","verify"],alg:"ES256",ext:true,d:j.d,crv:j.crv,x:j.x,y:j.y}]),{mode:0o600})'

      - name: La base et les images
        run: npm run sauvegarde:nuit -- --dossier "$RUNNER_TEMP/sauvegarde"

      - name: Vers le seau S3, à Paris
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-3
          SEAU_S3: ${{ secrets.SEAU_S3 }}
        run: |
          jour="$(TZ=Europe/Paris date +%Y-%m-%d)"
          aws s3 cp "$RUNNER_TEMP/sauvegarde" "s3://$SEAU_S3/$jour/" --recursive --only-show-errors
          echo "Sauvegarde déposée : $jour"

      - name: Rien ne reste sur la machine
        if: always()
        # Depuis la racine : le dossier app peut manquer si le départ a échoué
        working-directory: .
        run: rm -rf app/production.env app/supabase/signing_keys.json "$RUNNER_TEMP/sauvegarde"
